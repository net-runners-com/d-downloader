<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>講座ダウンローダー</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    color: #e5e7eb; background: #0b1220; }
  header { position: sticky; top: 0; z-index: 5; background: #0b1220cc; backdrop-filter: blur(6px);
    border-bottom: 1px solid #1f2937; padding: 14px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; margin-right: auto; }
  button { font: inherit; color: #fff; background: #2563eb; border: 0; border-radius: 8px;
    padding: 9px 14px; cursor: pointer; font-weight: 600; }
  button.secondary { background: #1f2937; border: 1px solid #374151; }
  button:disabled { opacity: .5; cursor: default; }
  #dir { font-size: 12px; opacity: .85; max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { padding: 16px 20px 80px; max-width: 900px; margin: 0 auto; }
  .course { border: 1px solid #1f2937; border-radius: 12px; margin: 0 0 14px; overflow: hidden; }
  .course > h2 { font-size: 14px; margin: 0; padding: 11px 14px; background: #111827; display: flex; gap: 10px; align-items: center; }
  .course > h2 label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .err { color: #f87171; font-weight: 600; }
  .parts { padding: 6px 14px 12px; }
  .part { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px dashed #1f2937; }
  .part:first-child { border-top: 0; }
  .part .t { min-width: 0; }
  .part .t .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 6px; background: #1f2937; border-radius: 9999px; overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; width: 0; background: #22c55e; transition: width .15s; }
  .st { font-size: 11px; opacity: .75; white-space: nowrap; }
  .st.err { color: #f87171; opacity: 1; }
  .st.done { color: #22c55e; opacity: 1; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: #2563eb; }
  .note { opacity: .7; font-size: 12px; margin: 6px 0 16px; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: #0b1220ee; border-top: 1px solid #1f2937;
    padding: 12px 20px; display: flex; gap: 12px; align-items: center; justify-content: flex-end; }
  #summary { margin-right: auto; font-size: 13px; opacity: .85; }
</style>
</head>
<body>
  <header>
    <h1>講座ダウンローダー</h1>
    <button id="pick" class="secondary">保存先フォルダを選ぶ</button>
    <span id="dir">保存先: 未選択</span>
    <label style="font-size:12px; display:flex; gap:6px; align-items:center;">形式
      <select id="fmt" style="font:inherit; color:#e5e7eb; background:#1f2937; border:1px solid #374151; border-radius:6px; padding:5px 6px;">
        <option value="mp4">MP4</option>
        <option value="ts">TS</option>
      </select>
    </label>
  </header>
  <main>
    <p class="note">保存したいPARTにチェックを付け、保存先フォルダを選んで「ダウンロード開始」。フォルダ内に講座名のサブフォルダを作り、<b>.ts</b>（最高画質）で保存します。</p>
    <div id="list"></div>
  </main>
  <footer>
    <span id="summary"></span>
    <button id="all" class="secondary">全選択</button>
    <button id="none" class="secondary">全解除</button>
    <button id="start" disabled>ダウンロード開始</button>
  </footer>
  <script src="vendor/mux.min.js"></script>
  <script src="downloader.js"></script>
</body>
</html>
