<!doctype html>
<meta charset="utf-8">
<title>講座ダウンローダー</title>
<style>
  body { width: 270px; margin: 0; font: 13px/1.5 system-ui, sans-serif; color: #e5e7eb; background: #0b1220; }
  .p { padding: 14px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  p { margin: 0 0 10px; opacity: .85; }
  a.btn { display: block; text-align: center; text-decoration: none; color: #fff;
    background: #2563eb; border-radius: 8px; padding: 9px; font-weight: 600; }
  ol { margin: 10px 0 0; padding-left: 18px; opacity: .85; }
  li { margin: 3px 0; }
</style>
<div class="p">
  <h1>ダイレクトアカデミー DL</h1>
  <p>ライブラリで講座にチェックを付け、下部の「選択した講座をダウンロード」→ ダウンローダーで保存先フォルダを選び、PARTを選んで保存。</p>
  <a class="btn" href="https://dpub.jp/library/" target="_blank" rel="noopener">ライブラリを開く</a>
  <ol>
    <li>保存先は任意フォルダを選択（一度選べば記憶）</li>
    <li>形式: .ts（最高画質）</li>
    <li>講座ページ左下の「⬇ この講座を保存」でも可</li>
  </ol>
</div>
